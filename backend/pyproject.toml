[project]
name = "minos-api"
version = "0.1.0"
description = "minOS 2.0 - API, conectores (scrapers) y motor de riesgo reputacional"
requires-python = ">=3.12"
dependencies = [
    # Servicio de análisis (carpeta nlp/): se reutiliza su diccionario como respaldo.
    "minos-nlp",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
