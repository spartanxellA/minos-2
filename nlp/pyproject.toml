[project]
name = "minos-nlp"
version = "0.1.0"
description = "minOS 2.0 - servicio de análisis de menciones (sentimiento, acusaciones graves, tema)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.70",
]

[project.optional-dependencies]
# Modelo multilingüe local de sentimiento. Sin él se usa el diccionario.
transformers = ["transformers>=4.44", "torch>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minos_nlp"]
