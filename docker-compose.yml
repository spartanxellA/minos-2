# Entorno completo: docker compose up --build
# Tablero: http://localhost:3000 · API: http://localhost:5080 · NLP: http://localhost:8000/health
# Al arrancar, el servicio "migrate" aplica las migraciones pendientes y la API espera a que termine.
# Los scrapers y el motor de riesgo corren en "worker", aparte de la API; se comunican por Redis.
# Más réplicas de workers: docker compose up -d --scale worker=3

x-api: &api
  image: minos-api
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &api-env
    MINOS_ENV: ${MINOS_ENV:-development}
    MINOS_DATABASE_URL: postgresql+asyncpg://minos:${POSTGRES_PASSWORD:-minos}@db:5432/minos
    MINOS_NLP_URL: http://nlp:8000
    MINOS_REDIS_URL: redis://redis:6379/0
    MINOS_DEMO__ENABLED: ${DEMO_ENABLED:-true}
    MINOS_CORS_ORIGINS: '["http://localhost:3000"]'
    MINOS_AUTH__MODE: ${AUTH_MODE:-local}
    MINOS_AUTH__BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    MINOS_AUTH__BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    MINOS_AUTH__IDLE_TIMEOUT: ${IDLE_TIMEOUT_SECONDS:-1800}
    MINOS_CONNECTORS__RSS__FEEDS: ${RSS_FEEDS:-[]}
    MINOS_CONNECTORS__X__BEARER_TOKEN: ${X_BEARER_TOKEN:-}
    MINOS_CONNECTORS__YOUTUBE__API_KEY: ${YOUTUBE_API_KEY:-}
    MINOS_CONNECTORS__YOUTUBE__POLL_INTERVAL: ${YOUTUBE_POLL_INTERVAL:-1800}
    MINOS_CONNECTORS__YOUTUBE__DAILY_QUOTA: ${YOUTUBE_DAILY_QUOTA:-10000}
    MINOS_CONNECTORS__BLUESKY__IDENTIFIER: ${BLUESKY_IDENTIFIER:-}
    MINOS_CONNECTORS__BLUESKY__APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
    MINOS_CONNECTORS__JETSTREAM__ENABLED: ${BLUESKY_LIVE:-false}
    MINOS_CONNECTORS__REDDIT__CLIENT_ID: ${REDDIT_CLIENT_ID:-}
    MINOS_CONNECTORS__REDDIT__CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
    MINOS_CONNECTORS__REDDIT__USER_AGENT: ${REDDIT_USER_AGENT:-minOS/2.0}
    MINOS_CONNECTORS__META__ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
    MINOS_WATCHLISTS__ENABLED: ${WATCHLISTS_ENABLED:-true}
    MINOS_WATCHLISTS__WORLDBANK_API_KEY: ${WORLDBANK_API_KEY:-}
    MINOS_NOTIFICATIONS__DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    MINOS_NOTIFICATIONS__EMAIL__HOST: ${ALERT_EMAIL_HOST:-}
    MINOS_NOTIFICATIONS__EMAIL__PORT: ${ALERT_EMAIL_PORT:-587}
    MINOS_NOTIFICATIONS__EMAIL__USERNAME: ${ALERT_EMAIL_USERNAME:-}
    MINOS_NOTIFICATIONS__EMAIL__PASSWORD: ${ALERT_EMAIL_PASSWORD:-}
    MINOS_NOTIFICATIONS__EMAIL__FROM_ADDR: ${ALERT_EMAIL_FROM:-}
    MINOS_NOTIFICATIONS__EMAIL__TO: ${ALERT_EMAIL_TO:-[]}
    MINOS_NOTIFICATIONS__WEBHOOK__URLS: ${ALERT_WEBHOOK_URLS:-[]}
    MINOS_NOTIFICATIONS__WEBHOOK__SECRET: ${ALERT_WEBHOOK_SECRET:-}
    MINOS_NOTIFICATIONS__WHATSAPP__ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
    MINOS_NOTIFICATIONS__WHATSAPP__PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    MINOS_NOTIFICATIONS__WHATSAPP__TO: ${WHATSAPP_TO:-[]}
    # Ajustes finos con su propio nombre (docs/CONFIGURACION.md). Sin valor: Compose los toma de .env y, si no están,
    # no los manda al contenedor y vale el valor por omisión de minos/config.py.
    MINOS_TIMEZONE:
    MINOS_AUTH__SESSION_TTL:
    MINOS_AUTH__COOKIE_NAME:
    MINOS_AUTH__MAX_FAILED_LOGINS:
    MINOS_AUTH__LOCKOUT:
    MINOS_AUTH__ACCOUNT_MAX_FAILED_LOGINS:
    MINOS_AUTH__ACCOUNT_WINDOW:
    MINOS_AUTH__IP_MAX_FAILED_LOGINS:
    MINOS_AUTH__IP_WINDOW:
    MINOS_AUTH__SECURITY_ALERTS_PER_HOUR:
    MINOS_AUTH__MIN_PASSWORD_LENGTH:
    MINOS_DEMO__POLL_INTERVAL:
    MINOS_INGESTION__TICK:
    MINOS_INGESTION__MAX_MENTIONS_PER_RUN:
    MINOS_INGESTION__DUPLICATE_WINDOW:
    MINOS_INGESTION__LOCK_TTL:
    MINOS_INGESTION__GEO__ENABLED:
    MINOS_INGESTION__GEO__DEFAULT_COUNTRY:
    MINOS_INGESTION__GEO__FROM_TEXT:
    MINOS_RISK_ENGINE__FULL_RECOMPUTE_EVERY:
    MINOS_RISK_ENGINE__WINDOW:
    MINOS_RISK_ENGINE__BASELINE_DAYS:
    MINOS_RISK_ENGINE__MIN_BASELINE_DAYS:
    MINOS_RISK_ENGINE__MEDIA_WEIGHT:
    MINOS_RISK_ENGINE__SURVEY_WEIGHT:
    MINOS_RISK_ENGINE__ALERT_COOLDOWN:
    MINOS_CONNECTORS__RSS__USE_GOOGLE_NEWS_SEARCH:
    MINOS_CONNECTORS__RSS__GOOGLE_NEWS_LOCALE:
    MINOS_CONNECTORS__RSS__POLL_INTERVAL:
    MINOS_CONNECTORS__RSS__USER_AGENT:
    MINOS_CONNECTORS__RSS__MIN_GAP_PER_HOST:
    MINOS_CONNECTORS__X__MAX_RESULTS:
    MINOS_CONNECTORS__X__POLL_INTERVAL:
    MINOS_CONNECTORS__X__EXCLUDE_RETWEETS:
    MINOS_CONNECTORS__YOUTUBE__REGION_CODE:
    MINOS_CONNECTORS__YOUTUBE__RELEVANCE_LANGUAGE:
    MINOS_CONNECTORS__YOUTUBE__QUOTA_SHARE:
    MINOS_CONNECTORS__BLUESKY__SERVICE:
    MINOS_CONNECTORS__BLUESKY__POLL_INTERVAL:
    MINOS_CONNECTORS__JETSTREAM__URL:
    MINOS_CONNECTORS__JETSTREAM__PROFILE_API:
    MINOS_CONNECTORS__JETSTREAM__REPLAY:
    MINOS_CONNECTORS__JETSTREAM__FLUSH_EVERY:
    MINOS_CONNECTORS__REDDIT__SUBREDDITS:
    MINOS_CONNECTORS__REDDIT__POLL_INTERVAL:
    MINOS_CONNECTORS__META__GRAPH_URL:
    MINOS_CONNECTORS__META__RECENT_POSTS:
    MINOS_CONNECTORS__META__POLL_INTERVAL:
    MINOS_NOTIFICATIONS__TIMEOUT:
    MINOS_NOTIFICATIONS__EMAIL__STARTTLS:
    MINOS_NOTIFICATIONS__WHATSAPP__TEMPLATE:
    MINOS_NOTIFICATIONS__WHATSAPP__LANGUAGE:
    MINOS_NOTIFICATIONS__WHATSAPP__GRAPH_URL:
    MINOS_WATCHLISTS__SOURCES:
    MINOS_WATCHLISTS__URLS:
    MINOS_WATCHLISTS__RETRY_AFTER:
    MINOS_WATCHLISTS__DOWNLOAD_TIMEOUT:
    MINOS_WATCHLISTS__SCREEN_EVERY:

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: minos
      POSTGRES_USER: minos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minos}
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minos -d minos"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["python", "-m", "minos.migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  nlp:
    image: minos-nlp
    build: ./nlp
    environment:
      MINOS_CLAUDE_ENABLED: ${MINOS_CLAUDE_ENABLED:-0}
      MINOS_CLAUDE_MODEL: ${MINOS_CLAUDE_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINOS_CLAUDE_EFFORT:
      MINOS_CLAUDE_BATCH:
      MINOS_HIGH_REACH:
    ports: ["8000:8000"]
    restart: unless-stopped

  api:
    <<: *api
    environment:
      <<: *api-env
      MINOS_ROLE: api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["5080:8080"]
    restart: unless-stopped

  # Conectores (scrapers), análisis y motor de riesgo. Escala con --scale worker=N.
  worker:
    <<: *api
    command: ["python", "-m", "minos.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nlp: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: minos-web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
