# Entorno completo: docker compose up --build
# Tablero: http://localhost:3000 · API: http://localhost:5080 · NLP: http://localhost:8000/health
# Al arrancar, el servicio "migrate" aplica las migraciones pendientes y la API espera a que termine.
# Los scrapers y el motor de riesgo corren en "worker", aparte de la API; se comunican por Redis.
# Más réplicas de workers: docker compose up -d --scale worker=3

x-api: &api
  image: minos-api
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &api-env
    MINOS_ENV: ${MINOS_ENV:-development}
    MINOS_DATABASE_URL: postgresql+asyncpg://minos:${POSTGRES_PASSWORD:-minos}@db:5432/minos
    MINOS_NLP_URL: http://nlp:8000
    MINOS_REDIS_URL: redis://redis:6379/0
    MINOS_DEMO__ENABLED: ${DEMO_ENABLED:-true}
    MINOS_CORS_ORIGINS: '["http://localhost:3000"]'
    MINOS_AUTH__AUTHORITY: ${AUTH_AUTHORITY:-}
    MINOS_CONNECTORS__X__BEARER_TOKEN: ${X_BEARER_TOKEN:-}
    MINOS_CONNECTORS__YOUTUBE__API_KEY: ${YOUTUBE_API_KEY:-}
    MINOS_CONNECTORS__BLUESKY__IDENTIFIER: ${BLUESKY_IDENTIFIER:-}
    MINOS_CONNECTORS__BLUESKY__APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: minos
      POSTGRES_USER: minos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minos}
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minos -d minos"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["python", "-m", "minos.migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  nlp:
    image: minos-nlp
    build: ./nlp
    environment:
      MINOS_CLAUDE_ENABLED: ${MINOS_CLAUDE_ENABLED:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    restart: unless-stopped

  api:
    <<: *api
    environment:
      <<: *api-env
      MINOS_ROLE: api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["5080:8080"]
    restart: unless-stopped

  # Conectores (scrapers), análisis y motor de riesgo. Escala con --scale worker=N.
  worker:
    <<: *api
    command: ["python", "-m", "minos.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nlp: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: minos-web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
